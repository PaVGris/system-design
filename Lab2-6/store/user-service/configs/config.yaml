components_manager:
    task_processors:
        main-task-processor:
            worker_threads: 4
        fs-task-processor:
            worker_threads: 2
        producer-task-processor:
            thread_name: producer
            worker_threads: 2
    default_task_processor: main-task-processor
    components:
        server:
            listener:
                port: 8081
                task_processor: main-task-processor
        logging:
            fs-task-processor: fs-task-processor
            loggers:
                default:
                    file_path: '@stdout'
                    level: info
        dynamic-config:
            defaults: {}
        http-client:
        http-client-core:
            fs-task-processor: fs-task-processor
        dns-client:
            fs-task-processor: fs-task-processor
        testsuite-support: {}
        users-storage: {}
        postgres-db:
            dbconnection: postgresql://user:pass@db:5432/store_db
            blocking_task_processor: fs-task-processor
            dns_resolver: async
        
        token-cache:
            groups:
                - config_name: token-cache
                  db: token-cache
                  sharding_strategy: RedisStandalone 
            subscribe_groups: []
            thread_pools:
                redis_thread_pool_size: 4
                sentinel_thread_pool_size: 1

        kafka-producer-users:
            delivery_timeout: 10s
            queue_buffering_max: 100ms
            enable_idempotence: true
            security_protocol: PLAINTEXT

        default-secdist-provider:
            config: configs/secdist.json 
            missing-ok: true
            environment-secrets-key: SECDIST_CONFIG

        handler-register:
            path: /users/register
            method: POST
            task_processor: main-task-processor
        handler-login:
            path: /users/login
            method: POST
            task_processor: main-task-processor
        handler-get-user:
            path: /users/{id}
            method: GET
            task_processor: main-task-processor
        handler-validate-token:
            path: /users/validate
            method: GET
            task_processor: main-task-processor
        handler-ping:
            path: /ping
            method: GET
            task_processor: main-task-processor
            throttling_enabled: false
        tests-control:
            load-enabled: $testsuite-enabled
            path: /tests/{action}
            method: POST
            task_processor: main-task-processor
            throttling_enabled: false